<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Loading">
  <title>GenLayer spinner, quorum variant</title>

  <style>
    .gl-ring {
      fill: none;
      stroke: #8A8A93;
      stroke-opacity: .20;
      stroke-width: 1.8;
    }
    .gl-orbit {
      transform-origin: 24px 24px;
      animation: gl-orbit 2s linear infinite;
    }
    .gl-node {
      animation: gl-node 2s cubic-bezier(.34, 1.3, .5, 1) infinite;
    }
    .gl-node.n1 { transform-origin: 24px 9px;       animation-delay: 0s; }
    .gl-node.n2 { transform-origin: 36.99px 31.5px; animation-delay: -1.333s; }
    .gl-node.n3 { transform-origin: 11.01px 31.5px; animation-delay: -0.667s; }

    .gl-core {
      fill: #111113;
      transform-origin: 17.0147px 16px;
      animation: gl-core 2s ease-in-out infinite;
    }

    @keyframes gl-orbit { to { transform: rotate(360deg); } }
    @keyframes gl-node {
      0%, 100% { transform: scale(.6);  opacity: .45; }
      16%      { transform: scale(1.18); opacity: 1; }
      46%      { transform: scale(.6);  opacity: .45; }
    }
    @keyframes gl-core {
      0%, 100% { opacity: .5;  transform: scale(1); }
      70%      { opacity: 1;   transform: scale(1.07); }
    }

    @media (prefers-color-scheme: dark) {
      .gl-core { fill: #FFFFFF; }
      .gl-ring { stroke: #FFFFFF; stroke-opacity: .16; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gl-orbit, .gl-node, .gl-core { animation: none; }
      .gl-node { opacity: 1; }
      .gl-core { opacity: 1; }
    }
  </style>

  <circle class="gl-ring" cx="24" cy="24" r="15"/>

  <g class="gl-orbit">
    <circle class="gl-node n1" cx="24"    cy="9"    r="3.9" fill="#9B83EA"/>
    <circle class="gl-node n2" cx="36.99" cy="31.5" r="3.9" fill="#75D4B6"/>
    <circle class="gl-node n3" cx="11.01" cy="31.5" r="3.9" fill="#EFB36A"/>
  </g>

  <g transform="translate(16.06 16.4) scale(0.465)">
    <g class="gl-core">
      <path d="M15.4065 11.2607L9.64908 23.3639L15.0689 26.072L0 32L15.4065 0V11.2607Z"/>
      <path d="M18.6229 11.2607L24.3803 23.3639L18.9605 26.072L34.0294 32L18.6229 0V11.2607Z"/>
      <path d="M16.9311 15.2394L20.3041 21.9088L16.9311 23.5623L13.7392 21.9019L16.9311 15.2394Z"/>
    </g>
  </g>
</svg>
