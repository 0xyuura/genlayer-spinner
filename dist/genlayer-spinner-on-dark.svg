<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Loading">
  <title>GenLayer spinner, forced dark surface</title>
  <defs>
    <!-- One rainbow run per 120 degree slot, ending on the colour it started
         with, so the three slots tile into a continuous ring with no seam.
         The three gradients are the same geometry rotated into place, which
         makes the whole ring exactly three fold symmetric. -->
    <linearGradient id="glpAD" gradientUnits="userSpaceOnUse" x1="44" y1="24" x2="14" y2="41.32">
      <stop offset="0" stop-color="#9B83EA"/>
      <stop offset="0.2" stop-color="#77AEE9"/>
      <stop offset="0.4" stop-color="#75D4B6"/>
      <stop offset="0.6" stop-color="#E694C4"/>
      <stop offset="0.8" stop-color="#EFB36A"/>
      <stop offset="1" stop-color="#9B83EA"/>
    </linearGradient>
    <linearGradient id="glpBD" gradientUnits="userSpaceOnUse" gradientTransform="rotate(120 24 24)" x1="44" y1="24" x2="14" y2="41.32">
      <stop offset="0" stop-color="#9B83EA"/>
      <stop offset="0.2" stop-color="#77AEE9"/>
      <stop offset="0.4" stop-color="#75D4B6"/>
      <stop offset="0.6" stop-color="#E694C4"/>
      <stop offset="0.8" stop-color="#EFB36A"/>
      <stop offset="1" stop-color="#9B83EA"/>
    </linearGradient>
    <linearGradient id="glpCD" gradientUnits="userSpaceOnUse" gradientTransform="rotate(240 24 24)" x1="44" y1="24" x2="14" y2="41.32">
      <stop offset="0" stop-color="#9B83EA"/>
      <stop offset="0.2" stop-color="#77AEE9"/>
      <stop offset="0.4" stop-color="#75D4B6"/>
      <stop offset="0.6" stop-color="#E694C4"/>
      <stop offset="0.8" stop-color="#EFB36A"/>
      <stop offset="1" stop-color="#9B83EA"/>
    </linearGradient>
  </defs>

  <style>
    /* r=20, circumference 125.664. one slot is 41.888. */

    .gl-track { fill: none; stroke: #FFFFFF; stroke-opacity: .16; stroke-width: 3.6; }

    /* the ring advances exactly one slot per round. 120 degrees maps the
       three fold arrangement onto itself, so the loop point is invisible. */
    .gl-rotor {
      transform-origin: 24px 24px;
      animation: gl-advance 1.6s cubic-bezier(.66, 0, .34, 1) infinite;
    }

    .gl-seg {
      fill: none;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-dasharray: 11 114.664;
      animation-duration: 1.6s;
      animation-timing-function: cubic-bezier(.5, 0, .2, 1);
      animation-iteration-count: infinite;
    }
    .gl-seg.s1 { stroke: url(#glpAD); stroke-dashoffset: 0;       animation-name: gl-vote-1; }
    .gl-seg.s2 { stroke: url(#glpBD); stroke-dashoffset: -41.888; animation-name: gl-vote-2; }
    .gl-seg.s3 { stroke: url(#glpCD); stroke-dashoffset: -83.776; animation-name: gl-vote-3; }

    .gl-core {
      fill: #FFFFFF;
      transform-origin: 17.0147px 16px;
      animation: gl-decide 1.6s cubic-bezier(.34, 1.4, .5, 1) infinite;
    }

    @keyframes gl-advance {
      0%, 58% { transform: rotate(0deg); }
      100%    { transform: rotate(120deg); }
    }

    /* each validator commits its arc in turn. the ring is whole from 46% to
       58%, which is the moment the decision is reached. */
    @keyframes gl-vote-1 {
      0%        { stroke-dasharray: 11 114.664; }
      30%, 58%  { stroke-dasharray: 40 85.664; }
      78%, 100% { stroke-dasharray: 11 114.664; }
    }
    @keyframes gl-vote-2 {
      0%, 10%   { stroke-dasharray: 11 114.664; }
      38%, 58%  { stroke-dasharray: 40 85.664; }
      86%, 100% { stroke-dasharray: 11 114.664; }
    }
    @keyframes gl-vote-3 {
      0%, 20%   { stroke-dasharray: 11 114.664; }
      46%, 58%  { stroke-dasharray: 40 85.664; }
      94%, 100% { stroke-dasharray: 11 114.664; }
    }

    @keyframes gl-decide {
      0%, 42%   { transform: scale(1);    opacity: .88; }
      56%       { transform: scale(1.13); opacity: 1; }
      76%, 100% { transform: scale(1);    opacity: .88; }
    }


    @media (prefers-reduced-motion: reduce) {
      .gl-rotor { animation: none; }
      .gl-seg   { animation: none; stroke-dasharray: 30 95.664; }
      .gl-core  { animation: none; opacity: 1; }
    }
  </style>

  <circle class="gl-track" cx="24" cy="24" r="20"/>

  <g class="gl-rotor">
    <circle class="gl-seg s1" cx="24" cy="24" r="20"/>
    <circle class="gl-seg s2" cx="24" cy="24" r="20"/>
    <circle class="gl-seg s3" cx="24" cy="24" r="20"/>
  </g>

  <g transform="translate(14.472 15.04) scale(0.56)">
    <g class="gl-core">
      <path d="M15.4065 11.2607L9.64908 23.3639L15.0689 26.072L0 32L15.4065 0V11.2607Z"/>
      <path d="M18.6229 11.2607L24.3803 23.3639L18.9605 26.072L34.0294 32L18.6229 0V11.2607Z"/>
      <path d="M16.9311 15.2394L20.3041 21.9088L16.9311 23.5623L13.7392 21.9019L16.9311 15.2394Z"/>
    </g>
  </g>
</svg>
