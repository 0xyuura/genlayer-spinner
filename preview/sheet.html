<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap">
<link rel="stylesheet" href="../dist/genlayer-spinner.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Switzer",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .sheet{width:1200px;display:grid;grid-template-columns:1fr 1fr}
  .half{padding:52px 48px;display:flex;flex-direction:column;align-items:center}
  .cap,.row{width:max-content}
  .cap{align-self:flex-start;margin-left:24px}
  .half.l{background:#fff;color:#111113}
  .half.r{background:#0d0d0f;color:#f5f5f7;color-scheme:dark}
  .cap{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.14em;
       text-transform:uppercase;opacity:.45;margin-bottom:34px}
  .row{display:flex;align-items:center;gap:38px;margin-bottom:38px}
  .row:last-child{margin-bottom:0}
  .lbl{font-size:12px;font-family:ui-monospace,Consolas,monospace;opacity:.45;width:76px}
  img{display:block}
</style></head>
<body>
<div class="sheet">
  <div class="half l">
    <div class="cap">Light surface</div>
    <div class="row"><span class="lbl">Consensus</span>
      <span class="gl-spinner" style="--gl-size:64px"></span>
      <span class="gl-spinner" style="--gl-size:40px"></span>
      <span class="gl-spinner" style="--gl-size:24px"></span>
      <span class="gl-spinner gl-spinner--sm"></span>
    </div>
    <div class="row"><span class="lbl">Quorum</span>
      <img src="../dist/genlayer-spinner-quorum.svg" width="64" height="64" alt="">
      <img src="../dist/genlayer-spinner-quorum.svg" width="40" height="40" alt="">
      <img src="../dist/genlayer-spinner-quorum.svg" width="24" height="24" alt="">
    </div>
    <div class="row"><span class="lbl">Sweep</span>
      <img src="../dist/genlayer-spinner-sweep.svg" width="64" height="64" alt="">
      <img src="../dist/genlayer-spinner-sweep.svg" width="40" height="40" alt="">
      <img src="../dist/genlayer-spinner-sweep.svg" width="24" height="24" alt="">
    </div>
  </div>
  <div class="half r">
    <div class="cap">Dark surface</div>
    <div class="row"><span class="lbl">Consensus</span>
      <span class="gl-spinner" style="--gl-size:64px"></span>
      <span class="gl-spinner" style="--gl-size:40px"></span>
      <span class="gl-spinner" style="--gl-size:24px"></span>
      <span class="gl-spinner gl-spinner--sm"></span>
    </div>
    <div class="row"><span class="lbl">Quorum</span>
      <img src="../dist/genlayer-spinner-quorum.svg" width="64" height="64" alt="">
      <img src="../dist/genlayer-spinner-quorum.svg" width="40" height="40" alt="">
      <img src="../dist/genlayer-spinner-quorum.svg" width="24" height="24" alt="">
    </div>
    <div class="row"><span class="lbl">Sweep</span>
      <img src="../dist/genlayer-spinner-sweep.svg" width="64" height="64" alt="">
      <img src="../dist/genlayer-spinner-sweep.svg" width="40" height="40" alt="">
      <img src="../dist/genlayer-spinner-sweep.svg" width="24" height="24" alt="">
    </div>
  </div>
</div>
</body></html>
